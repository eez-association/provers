# Stateful ECDSA proving on the default follower, reth v2.11.0 and evm2.
[workspace]
resolver = "2"
members = ["crates/eez-prover-stateful"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
# The follower, EVM and signing library come from one compatible root revision.
alloy-consensus        = { version = "=2.5.0", default-features = false }
alloy-eips             = { version = "=2.5.0", default-features = false }
alloy-primitives       = { version = "1", default-features = false }
alloy-rlp              = { version = "0.3", features = ["derive"] }
alloy-rpc-types-debug = { version = "=2.5.0", default-features = false }
alloy-rpc-types-engine = { version = "2", default-features = false }
async-trait        = "0.1"
eez-composer = { git = "https://github.com/eez-association/eez-rollup0", rev = "d7e2b505356790064c3666f8b9f3db8ff62a2632" }
eez-driver = { git = "https://github.com/eez-association/eez-rollup0", rev = "d7e2b505356790064c3666f8b9f3db8ff62a2632" }
eez-engine = { git = "https://github.com/eez-association/eez-rollup0", rev = "d7e2b505356790064c3666f8b9f3db8ff62a2632" }
eez-evm = { git = "https://github.com/eez-association/eez-rollup0", rev = "d7e2b505356790064c3666f8b9f3db8ff62a2632" }
eez-follower = { git = "https://github.com/eez-association/eez-rollup0", rev = "d7e2b505356790064c3666f8b9f3db8ff62a2632" }
eez-primitives = { git = "https://github.com/eez-association/eez-rollup0", rev = "d7e2b505356790064c3666f8b9f3db8ff62a2632" }
eez-proof-signer = { git = "https://github.com/eez-association/eez-rollup0", rev = "d7e2b505356790064c3666f8b9f3db8ff62a2632" }
evm2            = { git = "https://github.com/alloy-rs/evm2", rev = "66687c18b34d3bdbb899f5eb7605070615c03475", default-features = false, features = ["std", "block"] }
eyre               = "0.6"
lru                = "0.16.4"
reth-chain-state                = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-chainspec                  = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-engine-primitives          = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-ethereum-consensus         = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-evm                        = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-execution-types            = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-payload-builder            = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-payload-primitives         = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-primitives-traits          = { version = "0.8.1", default-features = false }
reth-provider                   = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-storage-api                = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
reth-trie-common                = { git = "https://github.com/paradigmxyz/reth", tag = "v2.11.0" }
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"

# Patches do not propagate from git dependencies, so these mirror reth v2.11.0's
# own (reth Cargo.toml [patch]). A patch cannot point back at its own source.
#
# evm2: reth-core 275ce4c declares evm2 f93318f and reth declares
# 66687c1; this unifies them on one source. debjit-bw/evm2@5885d6b is 66687c1
# plus `#[derive(Clone)]` on `BlockState` (alloy-rs/evm2#1078), which the
# stateful prover's mid-block checkpoints need. Return to reth's own patch
# (`DaniPopes/evm2`, evm2's pre-transfer URL) once a reth release carries an
# evm2 rev with that change.
[patch."https://github.com/alloy-rs/evm2"]
evm2            = { git = "https://github.com/debjit-bw/evm2", rev = "5885d6bc0aa8b7a40b5bf531e110225c46cacfd4" }
evm2-inspectors = { git = "https://github.com/debjit-bw/evm2", rev = "5885d6bc0aa8b7a40b5bf531e110225c46cacfd4" }
evm2-macros     = { git = "https://github.com/debjit-bw/evm2", rev = "5885d6bc0aa8b7a40b5bf531e110225c46cacfd4" }

# reth v2.11.0 depends on unreleased reth-core. The workspace keeps the crates.io
# floors ("0.8.1") so the shared crates also resolve in the signer's workspace
# (provers/stateless-ecdsa, crates.io 0.8.1).
[patch.crates-io]
reth-codecs            = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-codecs-derive     = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-rpc-traits        = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-zstd-compressors  = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }

# Profiles copied from reth (paradigmxyz/reth Cargo.toml), minus its
# hivetests/reproducible CI profiles. `release` is the fast-to-build
# default (the Docker images use it); `maxperf` is reth's
# production-release profile when top runtime speed is worth the
# build time; `profiling` keeps symbols for perf tooling.
[profile.dev]
# https://davidlattimore.github.io/posts/2024/02/04/speeding-up-the-rust-edit-build-run-cycle.html
debug = "line-tables-only"
split-debuginfo = "unpacked"
# Not in reth: this workspace predates the copy and keeps opt-level 1
# so a dev-built node stays usable for local runs.
opt-level = 1

# Speed up tests.
[profile.dev.package]
proptest.opt-level = 3
rand_chacha.opt-level = 3
rand_xorshift.opt-level = 3
unarray.opt-level = 3

[profile.ci-e2e]
inherits = "dev"
debug = "none"
split-debuginfo = "off"
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

# Use the `--profile profiling` flag to show symbols in release mode.
# e.g. `cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

# Include debug info in benchmarks too.
[profile.bench]
inherits = "profiling"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.maxperf-symbols]
inherits = "maxperf"
debug = "full"
strip = "none"

[workspace.lints.rust]
ambiguous_negative_literals  = "warn"
missing_debug_implementations = "warn"
redundant_imports             = "warn"
redundant_lifetimes           = "warn"
trivial_numeric_casts         = "warn"
unsafe_op_in_unsafe_fn        = "warn"
unused_lifetimes              = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }

# Permit the structured-logging macro format used by tracing::event! per M-LOG-STRUCTURED.
literal_string_with_formatting_args = "allow"

# Pragmatic opt-outs for pedantic rules that don't fit the reth-integration / protocol-port style.
# Mirrors the source workspace (rollup-node) so ported crates compile under the same posture they
# were written for — adding these later, per-file, would be noise.
module_name_repetitions          = "allow"
must_use_candidate               = "allow"
missing_panics_doc               = "allow"
missing_errors_doc               = "allow"
similar_names                    = "allow"
cast_possible_truncation         = "allow"
too_many_lines                   = "allow"
default_trait_access             = "allow"
missing_fields_in_debug          = "allow"
renamed_function_params          = "allow"
doc_markdown                     = "allow"
doc_lazy_continuation            = "allow"
ignored_unit_patterns            = "allow"
implicit_hasher                  = "allow"
items_after_statements           = "allow"
unreadable_literal               = "allow"
semicolon_if_nothing_returned    = "allow"
many_single_char_names           = "allow"
assigning_clones                 = "allow"
match_wildcard_for_single_variants = "allow"
used_underscore_items            = "allow"
unused_self                      = "allow"
needless_pass_by_value           = "allow"
if_then_some_else_none           = "allow"
type_complexity                  = "allow"
match_single_binding             = "allow"
single_match_else                = "allow"
map_unwrap_or                    = "allow"
clone_on_ref_ptr                 = "allow"
# New in clippy 1.99; `assert!(v.is_empty())` reads better in tests than `[] as [T; 0]`.
assert_is_empty                  = "allow"
# constructors (Deriver::new wires 9 deps) need these params;
# a refactor or dediacted crates would reduce some of this
too_many_arguments               = "allow"
